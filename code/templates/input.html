<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Input Data - Breast Cancer Detection</title>

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
      font-family: 'Poppins', sans-serif;
    }

    /* Navbar - matching gradient used elsewhere */
    .navbar {
      background: linear-gradient(45deg, #0077b6, #f72585);
    }

    .navbar-brand,
    .nav-link {
      color: #fff !important;
      font-weight: 500;
    }

    /* Card & form styling */
    .card {
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .form-label {
      font-weight: 600;
      color: #334;
    }

    .btn-custom {
      background: linear-gradient(90deg, #0077b6, #f72585);
      color: #fff;
      border: 0;
    }

    .btn-custom:hover {
      opacity: 0.95;
    }

    /* small responsive tweak */
    @media (max-width: 576px) {
      .container {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <i class="fas fa-ribbon me-2"></i>Breast Cancer Detection
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('input_page') }}">Input Data</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('performance') }}">Performance</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('charts') }}">Charts</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form -->
  <div class="container mt-5" style="max-width:900px;">
    <div class="card p-4">
      <h3 class="text-center mb-4"><i class="fas fa-notes-medical me-2"></i>Enter Patient Data</h3>

      <!-- IMPORTANT: action points to the same Flask route that handles GET/POST -->
      <form method="POST" action="{{ url_for('input_page') }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Area Worst</label>
            <input type="number" step="any" name="area_worst" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Concave Points Worst</label>
            <input type="number" step="any" name="concave_points_worst" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Concave Points Mean</label>
            <input type="number" step="any" name="concave_points_mean" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Radius Worst</label>
            <input type="number" step="any" name="radius_worst" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Perimeter Worst</label>
            <input type="number" step="any" name="perimeter_worst" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Perimeter Mean</label>
            <input type="number" step="any" name="perimeter_mean" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Concavity Mean</label>
            <input type="number" step="any" name="concavity_mean" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Area Mean</label>
            <input type="number" step="any" name="area_mean" class="form-control" required>
          </div>
        </div>

        <div class="mt-4 text-center">
          <button type="submit" class="btn btn-custom px-4">Predict</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
