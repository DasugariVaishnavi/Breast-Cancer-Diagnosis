<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Breast Cancer Detection{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Open Sans', sans-serif;
        }
        .navbar {
            background: linear-gradient(to right, #0077b6, #f72585);
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .card {
            border-radius: 15px;
        }
        .btn-custom {
            background: linear-gradient(to right, #0077b6, #f72585);
            color: white;
            border: none;
        }
        .btn-custom:hover {
            opacity: 0.9;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% if session.get('username') %}
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}"><i class="fas fa-ribbon"></i> Breast Cancer Detection</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('input_page') }}">Input Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('performance') }}">Performance</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('charts') }}">Charts</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
