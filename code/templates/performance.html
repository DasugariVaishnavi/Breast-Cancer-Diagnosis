<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Performance - Breast Cancer Detection</title>

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
      font-family: 'Poppins', sans-serif;
    }
    .navbar {
      background: linear-gradient(45deg, #0077b6, #f72585);
    }
    .navbar-brand, .nav-link { color: #fff !important; font-weight: 500; }
    .card {
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .table th {
      background-color: #0077b6;
      color: white;
    }
    .btn-custom {
      background: linear-gradient(90deg, #0077b6, #f72585);
      color: #fff;
      border: 0;
    }
    .btn-custom:hover { opacity: 0.95; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <i class="fas fa-ribbon me-2"></i>Breast Cancer Detection
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('input_page') }}">Input Data</a></li>
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('performance') }}">Performance</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('charts') }}">Charts</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Performance Card -->
  <div class="container mt-5" style="max-width:700px;">
    <div class="card p-4 text-center">
      <h3 class="mb-4"><i class="fas fa-chart-line me-2"></i>Model Performance</h3>

      <table class="table table-bordered text-center">
        <thead>
          <tr>
            <th>Metric</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Accuracy</td>
            <td>{{ metrics.accuracy }}%</td>
          </tr>
          <tr>
            <td>Precision</td>
            <td>{{ metrics.precision }}%</td>
          </tr>
          <tr>
            <td>Recall</td>
            <td>{{ metrics.recall }}%</td>
          </tr>
          <tr>
            <td>F1 Score</td>
            <td>{{ metrics.f1_score }}%</td>
          </tr>
        </tbody>
      </table>

      <div class="mt-4">
        <a href="{{ url_for('home') }}" class="btn btn-custom me-2">Back to Home</a>
        <a href="{{ url_for('input_page') }}" class="btn btn-secondary">Make Prediction</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
